# model to use if the agent doesn't specify one
#default_model = "openai-compatible/qwen3.5-27b:UD-Q4_K_XL"

# max output tokens (including reasoning)
#default_max_tokens = 16384

# max tool-use turns before stopping (default: 32)
#default_max_turns = 32

# fallback system prompt when no -s flag is given and no agent body sets one
#default_system_prompt = "you are a helpful assistant."

# max bytes of tool-call output rendered to stderr; full content is spooled to
# $XDG_CACHE_HOME/hrns/<pid>/<seq>.txt with a hint pointing at the file.
# set to 0 to disable truncation entirely (default: 2000)
#tool_output_truncate = 2000

# tools: register tools with the LLM. keys are gitignore-style globs
# matched against the tool name; most specific match wins. unmatched
# tools default to false. use "*" to set a default for all.
#[tools]
#"*" = false
#read = true
#bash = true

# permissions: control access levels (allow/ask/deny) per tool. the
# outer key is also a glob over tool names (most specific wins,
# default deny). the inner value is either a single level or a
# pattern map keyed by gitignore-style globs.
#[permissions]
#"*" = "deny"
#read = "allow"
# or with gitignore-style glob patterns (most specific wins):
#[permissions.read]
#"**" = "allow"
#"/etc/shadow" = "deny"
#[permissions.bash]
#"**" = "deny"
#"apt update" = "allow"

# hooks: gate which discovered hook scripts are loaded. keyed by the
# hook's declared `name` (returned in `discover`, defaulting to file
# stem). same glob semantics as [tools]; default false.
#[hooks]
#"*" = false
#observe = true
#datetime = true

# skills: gate which skills can be loaded into a system prompt. keyed
# by skill name (the file stem). same glob semantics as [tools];
# default false.
#[skills]
#"*" = false
#init = true

